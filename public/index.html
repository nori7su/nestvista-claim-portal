<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestvista NFT 受取ポータル</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #64748b;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #334155;
    }
    .divider span {
      padding: 0 10px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #2563eb;
    }
    .btn-google {
      background-color: #ffffff;
      color: #0f172a;
    }
    .btn-google:hover {
      background-color: #e2e8f0;
    }
    .btn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .user-info {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: left;
      font-size: 12px;
      word-break: break-all;
      border: 1px solid #3b82f6;
    }
    .user-info label {
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    .user-info span {
      color: #60a5fa;
      font-weight: bold;
    }
    .message {
      margin-top: 16px;
      font-size: 14px;
      word-break: break-all;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nestvista NFT 受取</h1>
    <p class="subtitle">Googleログインまたはアドレス入力で受け取る</p>

    <!-- Google ログインボタン -->
    <div>
      <button class="btn btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Googleアカウントで受け取る
      </button>
    </div>

    <div class="divider"><span>またはアドレスを直接入力</span></div>

    <!-- ログイン時に自動検出されたアドレス枠 -->
    <div id="userInfoBox" class="user-info" style="display: none;">
      <label>Googleで生成されたウォレットアドレス:</label>
      <span id="detectedAddress">-</span>
    </div>

    <!-- アドレス入力フォーム -->
    <div class="form-group">
      <input type="text" id="address" placeholder="ウォレットアドレス (0x...)" autocomplete="off">
    </div>

    <div class="form-group">
      <input type="password" id="passcode" placeholder="合言葉">
    </div>

    <button id="claimBtn" class="btn btn-primary">NFTを受け取る</button>

    <div id="message" class="message"></div>
  </div>

  <script type="module">
    import { createThirdwebClient } from "https://esm.sh/thirdweb@5.50.0";
    import { inAppWallet } from "https://esm.sh/thirdweb@5.50.0/wallets";

    const CLIENT_ID = "1f5150af54185093f69170928e4cdb43";
    const client = createThirdwebClient({ clientId: CLIENT_ID });

    const addressInput = document.getElementById("address");
    const claimBtn = document.getElementById("claimBtn");
    const messageDiv = document.getElementById("message");
    const userInfoBox = document.getElementById("userInfoBox");
    const detectedAddress = document.getElementById("detectedAddress");
    const googleBtn = document.getElementById("googleBtn");

    googleBtn.addEventListener("click", async () => {
      try {
        messageDiv.textContent = "Googleログインの応答を待機中...";
        messageDiv.className = "message info";
        googleBtn.disabled = true;

        const wallet = inAppWallet();

        // ログイン接続を実行
        const account = await wallet.connect({
          client,
          strategy: "google",
        });

        // 成功時のアドレス割り当て
        if (account && account.address) {
          const userAddress = account.address;
          addressInput.value = userAddress;
          detectedAddress.textContent = userAddress;
          userInfoBox.style.display = "block";

          messageDiv.textContent = "ログインに成功しました！合言葉を入力して「NFTを受け取る」を押してください。";
          messageDiv.className = "message success";
          
          checkStatus(userAddress);
        } else {
          throw new Error("No address returned");
        }
      } catch (err) {
        console.error("Google Login Error:", err);
        messageDiv.textContent = "Googleログインに失敗またはキャンセルされました。";
        messageDiv.className = "message error";
      } finally {
        googleBtn.disabled = false;
      }
    });

    async function checkStatus(address) {
      if (address.length === 42 && address.startsWith("0x")) {
        try {
          const res = await fetch(`/api/check-status?address=${address}`);
          const data = await res.json();

          if (data.claimed) {
            messageDiv.textContent = "このアドレスはすでにNFTを受け取り済みです。";
            messageDiv.className = "message info";
            claimBtn.disabled = true;
            claimBtn.textContent = "受け取り済み";
          } else {
            claimBtn.disabled = false;
            claimBtn.textContent = "NFTを受け取る";
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        claimBtn.disabled = false;
        claimBtn.textContent = "NFTを受け取る";
      }
    }

    addressInput.addEventListener("input", () => {
      checkStatus(addressInput.value.trim());
    });

    claimBtn.addEventListener("click", async () => {
      const address = addressInput.value.trim();
      const passcode = document.getElementById("passcode").value;

      if (!address || !passcode) {
        messageDiv.textContent = "アドレスと合言葉の両方を入力してください。";
        messageDiv.className = "message error";
        return;
      }

      claimBtn.disabled = true;
      claimBtn.textContent = "処理中...";
      messageDiv.textContent = "";

      try {
        const response = await fetch("/api/claim", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address, passcode })
        });

        const data = await response.json();

        if (data.success) {
          messageDiv.textContent = "NFTの受け取りが完了しました！";
          messageDiv.className = "message success";
          claimBtn.textContent = "受け取り済み";
        } else {
          messageDiv.textContent = data.message || "処理に失敗しました。";
          messageDiv.className = "message error";
          if (!data.claimed) {
            claimBtn.disabled = false;
            claimBtn.textContent = "NFTを受け取る";
          }
        }
      } catch (err) {
        messageDiv.textContent = "通信エラーが発生しました。";
        messageDiv.className = "message error";
        claimBtn.disabled = false;
        claimBtn.textContent = "NFTを受け取る";
      }
    });
  </script>
</body>
</html>
