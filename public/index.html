<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestvista NFT 受取</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .message {
      margin-top: 16px;
      font-size: 14px;
      word-break: break-all;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
    .info {
      color: #fbbf24;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nestvista NFT 受取</h1>
    <p class="subtitle">ウォレットアドレスと合言葉を入力してください</p>

    <div class="form-group">
      <input type="text" id="address" placeholder="ウォレットアドレス (0x...)" autocomplete="off">
    </div>

    <div class="form-group">
      <input type="password" id="passcode" placeholder="合言葉">
    </div>

    <button id="claimBtn" onclick="handleClaim()">NFTを受け取る</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const addressInput = document.getElementById("address");
    const claimBtn = document.getElementById("claimBtn");
    const messageDiv = document.getElementById("message");

    // アドレス入力時に即座に「受け取り済み」かチェック
    addressInput.addEventListener("input", async () => {
      const address = addressInput.value.trim();
      messageDiv.textContent = "";
      messageDiv.className = "message";

      if (address.length === 42 && address.startsWith("0x")) {
        try {
          const res = await fetch(`/api/check-status?address=${address}`);
          const data = await res.json();

          if (data.claimed) {
            messageDiv.textContent = "このアドレスはすでにNFTを受け取り済みです。";
            messageDiv.className = "message info";
            claimBtn.disabled = true;
            claimBtn.textContent = "受け取り済み";
          } else {
            claimBtn.disabled = false;
            claimBtn.textContent = "NFTを受け取る";
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        claimBtn.disabled = false;
        claimBtn.textContent = "NFTを受け取る";
      }
    });

    async function handleClaim() {
      const address = addressInput.value.trim();
      const passcode = document.getElementById("passcode").value;

      if (!address || !passcode) {
        messageDiv.textContent = "アドレスと合言葉の両方を入力してください。";
        messageDiv.className = "message error";
        return;
      }

      claimBtn.disabled = true;
      claimBtn.textContent = "処理中...";
      messageDiv.textContent = "";

      try {
        const response = await fetch("/api/claim", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address, passcode })
        });

        const data = await response.json();

        if (data.success) {
          messageDiv.textContent = "NFTの受け取りが完了しました！";
          messageDiv.className = "message success";
          claimBtn.textContent = "受け取り済み";
        } else {
          messageDiv.textContent = data.message || "処理に失敗しました。";
          messageDiv.className = "message error";
          if (!data.claimed) {
            claimBtn.disabled = false;
            claimBtn.textContent = "NFTを受け取る";
          }
        }
      } catch (err) {
        messageDiv.textContent = "通信エラーが発生しました。";
        messageDiv.className = "message error";
        claimBtn.disabled = false;
        claimBtn.textContent = "NFTを受け取る";
      }
    }
  </script>
</body>
</html>
